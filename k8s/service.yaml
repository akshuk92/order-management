apiVersion: v1
kind: Service
metadata:
  name: order-app-service
  namespace: default
  labels:
    app: order-management
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/actuator/prometheus"
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  selector:
    app: order-management
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
