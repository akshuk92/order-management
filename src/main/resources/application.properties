# =========================================================
# Application Info
# =========================================================
spring.application.name=order-management-devops-demo

# =========================================================
# Server Configuration
# =========================================================
server.port=8080

# =========================================================
# Datasource Configuration (No hardcoded credentials)
# Values are injected via environment variables at runtime
# =========================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / Hibernate Configuration
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =========================================================
# SQL Init (data.sql) - runs after Hibernate creates schema
# =========================================================
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# =========================================================
# Actuator / Prometheus Monitoring
# =========================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true

# =========================================================
# Logging
# =========================================================
logging.level.root=INFO
logging.level.com.example.order=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %5p [%t] %c{1}: %m%n
